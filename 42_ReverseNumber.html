<!DOCTYPE html>
<html>
<head>
    <title>42. Reverse a Number</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #f7df1e; }
        pre { background: #222; color: #0f0; padding: 15px; border-radius: 4px; overflow-x: auto; }
        .output { background: #f0f0f0; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
<div class="container">
    <h1>42. Reverse a Number</h1>
    <pre>function reverseNumber(num) {
    let rev = 0;
    while (num !== 0) {
        let rem = num % 10;
        rev = rev * 10 + rem;
        num = Math.floor(num / 10);
    }
    return rev;
}
console.log(reverseNumber(12345));</pre>
    <div class="output"><strong>Output:</strong> 54321</div>
</div>
</body>
</html>
