<!DOCTYPE html>
<html>
<head>
    <title>65. Calculate Factorial Using Recursion</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #f7df1e; }
        pre { background: #222; color: #0f0; padding: 15px; border-radius: 4px; overflow-x: auto; }
        .output { background: #f0f0f0; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
<div class="container">
    <h1>65. Calculate Factorial Using Recursion</h1>
    <pre>function factorialRecursive(n) {
    if (n === 0 || n === 1)
        return 1;
    return n * factorialRecursive(n - 1);
}
console.log(factorialRecursive(5));</pre>
    <div class="output"><strong>Output:</strong> 120</div>
</div>
</body>
</html>
