<!DOCTYPE html>
<html>
<head>
    <title>14. Find GCD of Two Numbers</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #007bff; }
        pre { background: #222; color: #0f0; padding: 15px; border-radius: 4px; overflow-x: auto; }
        .output { background: #f0f0f0; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
<div class="container">
    <h1>14. Find GCD of Two Numbers</h1>
    <pre>#include &lt;stdio.h&gt;
int main() {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    while (b != 0) {
        int temp = b;
        b = a % b;
        a = temp;
    }
    printf("GCD = %d\n", a);
    return 0;
}</pre>
</div>
</body>
</html>
