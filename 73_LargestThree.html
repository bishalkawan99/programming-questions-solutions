    <h1>73. Find Largest of Three Numbers</h1>
    <pre>&lt;?php
    $a = 5;
    $b = 10;
    $c = 8;
    if ($a >= $b && $a >= $c)
        echo "Largest = $a";
    elseif ($b >= $a && $b >= $c)
        echo "Largest = $b";
    else
        echo "Largest = $c";
?&gt;</pre>
