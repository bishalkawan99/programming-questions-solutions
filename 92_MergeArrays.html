    <h1>92. Merge Two Arrays</h1>
    <pre>&lt;?php

    $arr2 = [4, 5, 6];
    $merged = array_merge($arr1, $arr2);
    foreach ($merged as $value)
        echo $value . " ";
?&gt;</pre>
    <div class="output"><strong>Output:</strong> 1 2 3 4 5 6</div>
