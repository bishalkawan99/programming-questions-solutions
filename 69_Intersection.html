<!DOCTYPE html>
<html>
<head>
    <title>69. Find Intersection of Two Arrays</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #f7df1e; }
        pre { background: #222; color: #0f0; padding: 15px; border-radius: 4px; overflow-x: auto; }
        .output { background: #f0f0f0; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
<div class="container">
    <h1>69. Find Intersection of Two Arrays</h1>
    <pre>let arr1 = [1, 2, 3, 4, 5];
let arr2 = [3, 4, 5, 6, 7];
let intersection = arr1.filter(x => arr2.includes(x));
console.log(intersection);</pre>
    <div class="output"><strong>Output:</strong> [3, 4, 5]</div>
</div>
</body>
</html>
